    <script>
      // The browser's own scroll restoration re-applies the last pixel
      // offset on reload — after a fresh deploy the page content above that
      // offset is a different height, so the site opens mid-page instead of
      // at the top. Must run before the browser's restoration kicks in,
      // hence inline here rather than in a module script.
      if ("scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
    </script>
    <script>
      // Counterpart to public/404.html — restore the real path GitHub Pages
      // bounced through a query string, before React Router ever sees the URL.
      (function (l) {

          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
